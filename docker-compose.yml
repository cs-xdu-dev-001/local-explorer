services:
  mysql:
    image: mysql:8.0
    container_name: local-explorer-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: local_explorer
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - local-explorer-mysql:/var/lib/mysql
      - ./docs/local-explorer-init.sql:/docker-entrypoint-initdb.d/01-local-explorer-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p1234 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: local-explorer-redis
    ports:
      - "6379:6379"
    volumes:
      - local-explorer-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  local-explorer-mysql:
  local-explorer-redis:
